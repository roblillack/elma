[package]
name = "elma-tui"
version = "0.2.1"
edition = "2024"
description = "A modern terminal-based email client"
authors = ["Rob Lillack <rob@lillack.net>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/roblillack/elma"
# Neither the snapshot frames nor the recording made from them are read by
# anything a published build compiles: the tests that read the first are
# `#[cfg(test)]`, and the second is a picture for the README.
exclude = ["src/snapshots", "demo.gif"]

[[bin]]
name = "elma"
path = "src/main.rs"

# Records `demo.gif`. Behind a feature because it drives the client through the
# test harness, which a normal build has no reason to compile:
#
#     cargo run --release --example demo --features recorder
[[example]]
name = "demo"
path = "examples/demo/main.rs"
required-features = ["recorder"]

[features]
# Compiles the headless test harness outside of `cfg(test)`, so the demo
# example can drive the client without a terminal and record the README's GIF
# from the same SVG frames the snapshot tests compare.
recorder = []

[dependencies]
anyhow = "1"
crossterm = "0.29"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
# `default-features = false` drops tdoc's `remote` feature: we only render
# documents, and the feature pulls in a second HTTP and TLS stack.
tdoc = { version = "0.10", default-features = false }
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
async-imap = { version = "0.11", default-features = false, features = ["runtime-tokio"] }
# Both crates default to the `aws-lc-rs` provider, which needs a C compiler and
# cmake to build. `ring` has to be selected on its own: rustls refuses to pick a
# provider when the features name two of them, and panics on the first
# handshake. See `tls_config` in src/backend/gmail.rs.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# Certificates are checked against the operating system's trust store, the way
# they were before rustls. Pinned to the version lettre uses so SMTP and IMAP
# share one verifier rather than compiling two.
rustls-platform-verifier = "0.6"
futures = "0.3"
# Held at exactly 0.4.0 on purpose. 0.4.1+ ask reqwest for its `rustls` feature,
# which forces the `aws-lc-rs` provider — that puts aws-lc-sys, cmake and a C
# compiler back in the build and makes rustls panic on the ambiguous provider. A
# plain "0.4" lets `cargo update` walk into it. See ISSUE.md.
jmap-client = "=0.4.0"
mailparse = "0.16.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9.8"
imap-proto = "0.16"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls", "rustls-platform-verifier"] }
shell-words = "1"
tempfile = "3"
mime_guess = "2"
unicode-width = "0.2"

# Only for `poll(2)` on stdin, which is what puts a timeout on the terminal's
# answer to the background-colour query. See src/terminal.rs.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# Drives the SVG snapshot tests in `src/snapshot_tests.rs`: review changed
# frames with `cargo insta review`.
insta = "1.43"
# `macros` is what lets the fixture mailbox write its dates down as
# `datetime!(2026-03-14 08:15 UTC)`. Only the tests need it, and dev-dependency
# features stay out of a normal build.
time = { version = "0.3", features = ["macros"] }
# The demo recorder's two halves: resvg rasterises the harness's SVG frames,
# gif encodes them into the README's animation.
gif = "0.14"
resvg = "0.47"
# Lets the JMAP tests read the wire format back: what our request objects
# serialise to, and what a canned server response deserialises into. Already in
# the tree as a jmap-client dependency, so this costs no extra build.
serde_json = "1"
