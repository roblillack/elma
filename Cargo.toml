[package]
name = "elma-tui"
version = "0.1.0"
edition = "2024"
description = "A modern terminal-based email client"
authors = ["Rob Lillack <rob@lillack.net>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/roblillack/elma"

[[bin]]
name = "elma"
path = "src/main.rs"

[dependencies]
anyhow = "1"
crossterm = "0.29"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
# `default-features = false` drops tdoc's `remote` feature: we only render
# documents, and the feature pulls in a second HTTP and TLS stack.
tdoc = { version = "0.10", default-features = false }
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
async-imap = { version = "0.11", default-features = false, features = ["runtime-tokio"] }
# Both crates default to the `aws-lc-rs` provider, which needs a C compiler and
# cmake to build. `ring` has to be selected on its own: rustls refuses to pick a
# provider when the features name two of them, and panics on the first
# handshake. See `tls_config` in src/backend/gmail.rs.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# Certificates are checked against the operating system's trust store, the way
# they were before rustls. Pinned to the version lettre uses so SMTP and IMAP
# share one verifier rather than compiling two.
rustls-platform-verifier = "0.6"
futures = "0.3"
# Held at exactly 0.4.0 on purpose. 0.4.1+ ask reqwest for its `rustls` feature,
# which forces the `aws-lc-rs` provider — that puts aws-lc-sys, cmake and a C
# compiler back in the build and makes rustls panic on the ambiguous provider. A
# plain "0.4" lets `cargo update` walk into it. See ISSUE.md.
jmap-client = "=0.4.0"
mailparse = "0.16.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9.8"
imap-proto = "0.16"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls", "rustls-platform-verifier"] }
shell-words = "1"
tempfile = "3"
mime_guess = "2"
unicode-width = "0.2"
# The OAuth sign-in talks HTTP on its own, next to the JMAP session. Version and
# features are copied from what jmap-client asks for so both share one stack --
# in particular *not* reqwest's `rustls` feature, which would force the
# `aws-lc-rs` provider back into the build. See the note on jmap-client above.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots"] }
serde_json = "1"
base64 = "0.22"
# SHA-256 and the CSPRNG behind PKCE, taken from the provider rustls is already
# built with rather than a second crypto crate.
ring = "0.17"
url = "2"
