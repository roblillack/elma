[package]
name = "elma-tui"
version = "0.1.0"
edition = "2024"
description = "A modern terminal-based email client"
authors = ["Rob Lillack <rob@lillack.net>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/roblillack/elma"

[[bin]]
name = "elma"
path = "src/main.rs"

[dependencies]
anyhow = "1"
crossterm = "0.29"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
tdoc = "0.10"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
async-imap = { version = "0.11", default-features = false, features = ["runtime-tokio"] }
tokio-rustls = "0.26"
rustls = { version = "0.23", features = ["ring"] }
webpki-roots = "0.26"
futures = "0.3"
jmap-client = "0.4"
mailparse = "0.16.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9.8"
imap-proto = "0.16"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
shell-words = "1"
tempfile = "3"
